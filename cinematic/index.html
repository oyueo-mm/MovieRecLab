<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d0e">
<meta name="description" content="MovieRecLab 시네마틱 실험 버전. 기존 추천 엔진을 유지하는 독립 디자인 프리뷰.">
<title>영화 추천</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="./shell.css">
</head>
<body>
<div class="cinematic scroll-story" id="cinematic" data-stage="intro" style="--story-progress:0;--intro-opacity:1;--intro-y:0px;--intro-scale:1;--app-opacity:0;--app-y:80px;--app-scale:.94;--camera-zoom:1.09;--camera-blur:0px">
  <div class="scene-viewport" id="sceneViewport">
  <div class="scene-bg" aria-hidden="true"><div class="scene-photo"></div><div class="scene-shade"></div><div class="scene-light"></div></div>
  <section class="entrance" id="entrance" aria-label="시네마틱 입장 화면">
    <div class="entrance-inner"><h1>영화를<br>발견하다<span class="period">.</span></h1><button id="enter" class="enter" type="button" aria-label="영화 평가 시작" title="영화 평가 시작"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 24h26m-10-10 10 10-10 10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button></div>
  </section>
  <div class="scroll-indicator" id="scrollIndicator" aria-hidden="true"><svg viewBox="0 0 24 34"><path d="M12 2v26M3 19l9 9 9-9"/></svg></div>
  <div class="app-stage" id="appStage"><iframe id="appFrame" src="../index.html" title="MovieRecLab 영화 추천 애플리케이션" loading="eager" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="curtain" aria-hidden="true"></div>
  <div class="top-controls">
    <button id="backIntro" class="circle-control back-control" type="button" aria-label="시작 화면" title="시작 화면"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 4 12l8 8M4 12h16"/></svg></button>
    <span class="stage-label" id="stageLabel" aria-live="polite"></span>
    <button id="openMenu" class="circle-control" type="button" aria-label="메뉴" aria-expanded="false" aria-controls="menuPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
  </div>
  <div class="menu-veil" id="menuVeil" hidden></div>
  <aside class="menu-panel" id="menuPanel" aria-label="메뉴" aria-hidden="true">
    <div class="menu-header"><button id="closeMenu" type="button" aria-label="메뉴 닫기">×</button></div>
    <nav class="menu-links" aria-label="화면 이동">
      <button type="button" data-target="recommend">영화 추천</button>
      <button type="button" data-target="compare">알고리즘 비교</button>
      <button type="button" data-target="analysis">데이터 분석</button>
      <button type="button" data-target="visualize">추천 시각화</button>
      <button type="button" data-target="evaluate">성능 평가</button>
      <button type="button" data-target="guide">알고리즘 설명</button>
    </nav>
    <div class="menu-settings">
      <button type="button" id="toggleMotion" class="menu-setting" aria-pressed="false">모션 줄이기 <span>끔</span></button>
      <button type="button" id="toggleLanguage" class="menu-setting">제목 표시 <span id="languageLabel">한국어 우선</span></button>
      <a href="../index.html" class="legacy-link">기존 UI로 이동 <span>↗</span></a>
    </div>
  </aside>
  <div id="alert" class="alert" role="status" aria-live="polite" hidden></div>
  </div>
  <div class="story-scroll-track" id="storyTrack" aria-hidden="true"></div>
</div>
<script src="./shell.js"></script>
</body>
</html>
