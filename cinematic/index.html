<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d0e">
<meta name="description" content="MovieRecLab 시네마틱 실험 버전. 기존 추천 엔진을 유지하는 독립 디자인 프리뷰.">
<title>영화 추천 — Cinematic Preview</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="./shell.css">
</head>
<body>
<div class="cinematic" id="cinematic" data-stage="intro">
  <div class="scene-bg" aria-hidden="true"><div class="scene-photo"></div><div class="scene-shade"></div><div class="scene-light"></div></div>
  <section class="entrance" id="entrance" aria-label="시네마틱 입장 화면">
    <div class="entrance-inner"><div class="entrance-rule"></div><h1>영화를<br>발견하다<span class="period">.</span></h1><button id="enter" class="enter" type="button"><span>시작</span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 24h26m-10-10 10 10-10 10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button></div>
    <div class="entry-position" aria-hidden="true"><span>01</span><i></i><span>03</span></div>
  </section>
  <div class="app-stage" id="appStage"><iframe id="appFrame" src="../index.html" title="MovieRecLab 영화 추천 애플리케이션" loading="eager" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="curtain" aria-hidden="true"></div>
  <div class="top-controls">
    <button id="backIntro" class="circle-control back-control" type="button" aria-label="시작 화면" title="시작 화면"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 4 12l8 8M4 12h16"/></svg></button>
    <span class="stage-label" id="stageLabel" aria-live="polite"></span>
    <button id="openMenu" class="circle-control" type="button" aria-label="메뉴" aria-expanded="false" aria-controls="menuPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
  </div>
  <div class="menu-veil" id="menuVeil" hidden></div>
  <aside class="menu-panel" id="menuPanel" aria-label="메뉴" aria-hidden="true">
    <div class="menu-header"><span>메뉴</span><button id="closeMenu" type="button" aria-label="메뉴 닫기">×</button></div>
    <nav class="menu-links" aria-label="화면 이동">
      <button type="button" data-target="recommend">영화 추천<span>01</span></button>
      <button type="button" data-target="compare">알고리즘 비교<span>02</span></button>
      <button type="button" data-target="analysis">데이터 분석<span>03</span></button>
      <button type="button" data-target="visualize">추천 시각화<span>04</span></button>
      <button type="button" data-target="evaluate">성능 평가<span>05</span></button>
      <button type="button" data-target="guide">알고리즘 설명<span>06</span></button>
    </nav>
    <div class="menu-settings">
      <div class="menu-subtitle">보기</div>
      <button type="button" id="toggleMotion" class="menu-setting" aria-pressed="false">모션 줄이기 <span>끔</span></button>
      <button type="button" id="toggleLanguage" class="menu-setting">제목 표시 <span id="languageLabel">한국어 우선</span></button>
      <a href="../index.html" class="legacy-link">기존 UI로 이동 <span>↗</span></a>
    </div>
    <div class="credits"><p>MovieLens latest-small · GroupLens Research</p><p>공간 배경: <a href="https://unsplash.com/" target="_blank" rel="noopener noreferrer">Unsplash</a> 사진. 일부 영화 이미지 대신 장르 분위기 사진을 사용합니다.</p><p>이 화면은 독립 실험 버전입니다. 평가 데이터는 기존과 같이 새로고침 시 초기화됩니다.</p></div>
  </aside>
  <div id="alert" class="alert" role="status" aria-live="polite" hidden></div>
</div>
<script src="./shell.js"></script>
</body>
</html>
