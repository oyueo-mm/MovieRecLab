name: Showcase V2 regression
on:
  push:
    branches:
      - feat/showcase-ui-v2
      - feat/showcase-default-home
      - feat/showcase-netflix-ui
      - feat/showcase-research-redesign
      - feat/rating-and-research-polish
      - feat/showcase-multirail-v5
      - feat/poster-recommend-v6
  pull_request:
    paths:
      - 'showcase/**'
      - 'engine.js'
      - 'tests/quality-ab-live.js'
      - 'tests/poster-recovery.test.js'
      - 'index.html'
      - 'cinematic/index.html'
      - 'tests/showcase-default-route.test.js'
      - 'tests/showcase.test.js'
      - 'tests/showcase-research.test.js'
      - 'tests/showcase-multirail.test.js'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated showcase scripts
        run: |
          node --check showcase/bridge.js
          node --check showcase/art.js
          node --check showcase/showcase.js
          node --check showcase/research-studio.js
          node --check showcase/recommend-rails.js
          node --check engine.js
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Verify showcase ratings, posters, results and research navigation
        run: |
          node tests/showcase.test.js
          node tests/showcase-research.test.js
          node tests/showcase-multirail.test.js
          node tests/showcase-default-route.test.js
          node tests/poster-recovery.test.js
      - name: Verify existing recommendation algorithms
        run: |
          node tests/advanced.test.js
          node tests/ui-selection.test.js
          node tests/preset-rating.test.js
          node tests/visualization.test.js
          node tests/i18n.test.js
      - name: Verify original UI DOM functionality
        run: node tests/ui-dom-integration.test.js

      - name: Measure real MovieLens User KNN / Content recommendation quality
        run: node tests/quality-ab-live.js
