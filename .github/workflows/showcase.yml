name: Showcase V2 regression
on:
  push:
    branches:
      - feat/showcase-ui-v2
      - feat/showcase-default-home
      - feat/showcase-netflix-ui
      - feat/showcase-research-redesign
      - feat/rating-and-research-polish
      - feat/showcase-multirail-v5
      - feat/poster-recommend-v6
      - feat/poster-coverage-v7
      - fix/poster-loading-v8
      - feat/ml25m-tag-genome-v9
      - feat/v10-model-tournament
      - feat/v11-adaptive-cold-start
      - feat/v12-discovery-rails
      - feat/v13-taste-presets-12
      - feat/v14-rated-library-cinematic-detail
      - feat/v15-korean-plot-autohero
  pull_request:
    paths:
      - 'showcase/**'
      - 'scripts/train_ml25m.py'
      - 'tests/ml25m-inference.test.js'
      - 'tests/ml25m-artifact.test.js'
      - 'scripts/benchmark_v10.py'
      - 'tests/v10-inference.test.js'
      - 'tests/v10-artifact.test.js'
      - 'scripts/benchmark_v11.py'
      - 'tests/v11-inference.test.js'
      - 'tests/v11-artifact.test.js'
      - 'tests/v11-production.test.js'
      - 'tests/v12-rails.test.js'
      - 'tests/v14-showcase.test.js'
      - 'tests/v15-synopsis-autoplay.test.js'
      - 'tests/v12-quality-live.js'
      - 'demo-presets.js'
      - 'tests/preset-rating.test.js'
      - 'tests/preset-rails-live.test.js'
      - 'engine.js'
      - 'tests/quality-ab-live.js'
      - 'tests/poster-recovery.test.js'
      - 'tests/poster-map.test.js'
      - 'tests/poster-lazy-render.test.js'
      - 'scripts/build-poster-map.py'
      - 'tests/recommend-upgrades.test.js'
      - 'index.html'
      - 'cinematic/index.html'
      - 'tests/showcase-default-route.test.js'
      - 'tests/showcase.test.js'
      - 'tests/showcase-research.test.js'
      - 'tests/showcase-multirail.test.js'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated showcase scripts
        run: |
          node --check showcase/bridge.js
          node --check showcase/art.js
          node --check showcase/poster-map.js
          node --check showcase/showcase.js
          node --check showcase/synopsis.js
          node --check showcase/research-studio.js
          node --check showcase/recommend-rails.js
          node --check showcase/ml25m-recommender.js
          node --check showcase/ml25m-model.js
          node --check showcase/v10-recommender.js
          node --check showcase/v10-model.js
          node --check showcase/v11-recommender.js
          node --check showcase/v11-config.js
          node --check showcase/v12-rails.js
          node --check engine.js
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Verify showcase ratings, posters, results and research navigation
        run: |
          node tests/showcase.test.js
          node tests/v14-showcase.test.js
          node tests/v15-synopsis-autoplay.test.js
          node tests/v15-source-probe.js
          node tests/showcase-research.test.js
          node tests/showcase-multirail.test.js
          node tests/showcase-default-route.test.js
          node tests/poster-recovery.test.js
          node tests/poster-map.test.js
          node tests/poster-lazy-render.test.js
          node tests/ml25m-inference.test.js
          node tests/ml25m-artifact.test.js
          node tests/v10-inference.test.js
          node tests/v10-artifact.test.js
          node tests/v11-inference.test.js
          node tests/v11-artifact.test.js
          node tests/v11-production.test.js
          node tests/v12-rails.test.js
          node tests/preset-rating.test.js
          node tests/preset-rails-live.test.js
      - name: Verify existing recommendation algorithms
        run: |
          node tests/advanced.test.js
          node tests/ui-selection.test.js
          node tests/preset-rating.test.js
          node tests/visualization.test.js
          node tests/i18n.test.js
          node tests/recommend-upgrades.test.js
      - name: Verify original UI DOM functionality
        run: node tests/ui-dom-integration.test.js

      - name: Measure real MovieLens User KNN / Content recommendation quality
        run: |
          node tests/quality-ab-live.js
          node tests/v12-quality-live.js
