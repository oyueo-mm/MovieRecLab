name: Advanced recommender tests
on:
  pull_request:
  push:
    branches:
      - feat/recommender-model-zoo
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recommendation engines and workers
        run: node tests/advanced.test.js
