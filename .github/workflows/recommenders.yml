name: Advanced recommender tests
on:
  pull_request:
  push:
    branches:
      - feat/recommender-model-zoo
      - feat/v13-taste-presets-12
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recommendation engines and workers
        run: node tests/advanced.test.js
      - name: Verify unified algorithm selector
        run: node tests/ui-selection.test.js
      - name: Verify real recommendation visualizations
        run: node tests/visualization.test.js
      - name: Verify rating popup, search scroll and taste presets
        run: node tests/preset-rating.test.js
      - name: Verify all eight demo presets against real 25M movie embeddings and six recommendation rails
        run: node tests/preset-rails-live.test.js
      - name: Install DOM test dependencies
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Exercise preset, rating dialog and search pagination in a DOM
        run: node tests/ui-dom-integration.test.js
