name: Poster CDN reachability diagnosis
on:
  push:
    branches: [fix/poster-troubleshoot-v8]
    paths:
      - 'scripts/diagnose-poster-cdn.py'
      - '.github/workflows/poster-cdn-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check image retrieval from actual public CDN
        run: python scripts/diagnose-poster-cdn.py
